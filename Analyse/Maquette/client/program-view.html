<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Program | AntiGravity V3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="../admin/style.css">
</head>
<body class="bg-zinc-50 antialiased font-sans" x-data="{ sidebarOpen: false }">
    <!-- Mobile Header (Hamburger) -->
    <header class="lg:hidden fixed top-0 w-full bg-white ag-border border-x-0 border-t-0 p-4 flex justify-between items-center z-50">
        <div class="flex items-center space-x-2">
            <div class="h-5 w-5 bg-cyan-600"></div>
            <span class="font-mono font-bold text-sm tracking-tighter uppercase">My_AntiGravity</span>
        </div>
        <button @click="sidebarOpen = !sidebarOpen" class="text-zinc-900">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
    </header>

    <!-- Sidebar / Drawer -->
    <aside 
        class="fixed top-0 left-0 h-screen w-64 bg-white ag-border border-l-0 border-t-0 border-b-0 z-50 transition-transform duration-300 lg:translate-x-0"
        :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
        
        <div class="p-6">
            <div class="flex items-center space-x-3 mb-12">
                <div class="h-6 w-6 bg-cyan-600"></div>
                <div class="flex flex-col">
                    <span class="font-mono font-bold text-lg tracking-tighter uppercase leading-none">AntiGravity</span>
                    <span class="text-[8px] font-mono text-zinc-400 uppercase tracking-widest mt-1">Pupil_Portal_V3.0</span>
                </div>
            </div>

            <nav class="space-y-1">
                <a href="portal.html" class="flex items-center px-4 py-3 text-xs font-mono uppercase tracking-widest transition-all text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900">
                    Dashboard
                </a>
                <a href="evolution.html" class="flex items-center px-4 py-3 text-xs font-mono uppercase tracking-widest transition-all text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900">
                    Evolution
                </a>
      
                <a href="program-view.html" class="flex items-center px-4 py-3 text-xs font-mono uppercase tracking-widest transition-all bg-cyan-50 text-cyan-700 border-r-2 border-cyan-600">
                    My_Programs
                </a>
            </nav>
        </div>

        <!-- Pupil Indicator -->
        <div class="absolute bottom-0 w-full p-6 bg-zinc-50/50 ag-border border-x-0 border-b-0">
            <div class="flex items-center space-x-3">
                <div class="h-8 w-8 bg-white ag-border border-zinc-200 flex items-center justify-center text-cyan-600 font-mono text-xs font-bold">M</div>
                <div>
                    <p class="text-[10px] font-bold text-zinc-900 uppercase">Mehdi_B</p>
                    <p class="text-[8px] font-mono text-cyan-600 uppercase">Active_Pupil</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Backdrop -->
    <div x-show="sidebarOpen" @click="sidebarOpen = false" class="lg:hidden fixed inset-0 bg-black/10 backdrop-blur-sm z-40"></div>

    <main class="lg:ml-64 min-h-screen p-6 lg:p-12 pt-24 lg:pt-12 max-w-2xl">
        <header class="mb-10">
            <h1 class="text-3xl font-mono font-bold tracking-tighter uppercase text-zinc-900">Program_View</h1>
            <p class="text-[10px] font-mono text-zinc-400 mt-2 uppercase tracking-widest">Active_Protocol: Shred_X_Lite</p>
        </header>

        <div class="space-y-4">
            <!-- Meal Slot -->
            <template x-for="meal in [
                { time: '08:00', name: 'Ftor', menu: 'Oatmeal_Power_V3', kcal: '450' },
                { time: '13:00', name: 'Gheda', menu: 'Salmon_Bowl_V2', kcal: '650' },
                { time: '20:00', name: 'Acha', menu: 'Chicken_Salad_V1', kcal: '400' }
            ]">
                <div class="ag-card p-6 bg-white flex justify-between items-center group hover:border-cyan-200 transition-all cursor-pointer">
                    <div class="flex items-center space-x-4">
                        <div class="text-[10px] font-mono text-zinc-400 uppercase w-12" x-text="meal.time"></div>
                        <div class="h-8 w-[1px] bg-zinc-100"></div>
                        <div>
                            <p class="text-[8px] font-mono text-zinc-400 uppercase tracking-widest mb-1" x-text="meal.name"></p>
                            <p class="text-xs font-mono font-bold text-zinc-900 uppercase" x-text="meal.menu"></p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-mono font-bold text-cyan-600" x-text="meal.kcal + ' KCAL'"></p>
                    </div>
                </div>
            </template>
        </div>
    </main>
</body>
</html>
