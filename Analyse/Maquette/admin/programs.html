<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programs | AntiGravity V3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-50 antialiased" x-data="{ sidebarOpen: false, view: 'list' }">

    <!-- Sidebar -->
    <aside class="fixed top-0 left-0 h-screen w-64 bg-white ag-border border-l-0 border-t-0 border-b-0 z-50 transition-transform duration-300 lg:translate-x-0" :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
        <div class="p-6">
            <div class="flex items-center space-x-3 mb-12">
                <div class="h-6 w-6 bg-cyan-600"></div>
                <span class="font-mono font-bold text-lg uppercase tracking-tighter">AntiGravity</span>
            </div>
            <nav class="space-y-1">
                <a href="dashboard.html" class="flex items-center px-4 py-3 text-xs font-mono uppercase tracking-widest text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900">Dashboard</a>
                <div class="py-2">
                    <p class="px-4 text-[8px] font-mono text-zinc-400 uppercase tracking-widest mb-2">Nutrition_Engine</p>
                    <a href="categories.html" class="flex items-center px-4 py-2 text-xs font-mono uppercase tracking-widest text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900">Categories</a>
                    <a href="meals.html" class="flex items-center px-4 py-2 text-xs font-mono uppercase tracking-widest text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900">Meals</a>
                    <a href="programs.html" class="flex items-center px-4 py-2 text-xs font-mono uppercase tracking-widest bg-cyan-50 text-cyan-700 border-r-2 border-cyan-600">Programs</a>
                </div>
                <a href="clients.html" class="flex items-center px-4 py-3 text-xs font-mono uppercase tracking-widest text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900">Clients</a>
            </nav>
        </div>
    </aside>

    <main class="lg:ml-64 min-h-screen p-6 lg:p-12 pt-24 lg:pt-12">
        <header class="mb-10 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-mono font-bold tracking-tighter uppercase text-zinc-900">Program_Manager</h1>
                <p class="text-[10px] font-mono text-zinc-400 mt-2 uppercase tracking-widest">Step_03: Protocol Assembly</p>
            </div>
            <button @click="view = (view === 'list' ? 'create' : 'list')" 
                    class="px-6 py-3 bg-zinc-900 text-white text-[10px] font-mono uppercase font-bold tracking-widest hover:bg-black transition-all">
                <span x-text="view === 'list' ? 'Create_New_Protocol' : 'Return_to_List'"></span>
            </button>
        </header>

        <!-- List View -->
        <div x-show="view === 'list'" class="ag-card overflow-hidden">
            <table class="w-full text-left font-mono text-[10px]">
                <thead class="bg-zinc-50 border-b border-zinc-100 text-zinc-400 uppercase">
                    <tr>
                        <th class="px-6 py-4 font-bold tracking-widest">Protocol_Name</th>
                        <th class="px-6 py-4 font-bold tracking-widest">Meals_Count</th>
                        <th class="px-6 py-4 font-bold tracking-widest">Avg_Kcal</th>
                        <th class="px-6 py-4 font-bold tracking-widest text-right">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-zinc-100 uppercase">
                    <tr class="hover:bg-zinc-50 transition-colors">
                        <td class="px-6 py-4 font-bold text-zinc-900">Shred_X_Lite</td>
                        <td class="px-6 py-4 text-zinc-500">4 Slots</td>
                        <td class="px-6 py-4 text-cyan-600 font-bold">1,850 kcal</td>
                        <td class="px-6 py-4 text-right space-x-2">
                            <button class="text-zinc-300 hover:text-cyan-600 uppercase">Edit</button>
                            <button class="text-zinc-300 hover:text-red-500 uppercase">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Create View -->
        <div x-show="view === 'create'" class="max-w-4xl mx-auto space-y-6">
            <div class="ag-card p-8 bg-white">
                <h3 class="text-xs font-mono font-bold uppercase tracking-widest mb-10 border-b border-zinc-100 pb-4">Protocol_Timeline_Builder</h3>
                
                <div class="space-y-6">
                    <!-- Dynamic Slots -->
                    <template x-for="cat in ['Ftor', 'Gheda', 'Cas-croûte', 'Acha']" :key="cat">
                        <div class="flex flex-col md:flex-row md:items-center justify-between p-6 bg-zinc-50 ag-border group hover:border-cyan-200 transition-all">
                            <div class="flex items-center space-x-6">
                                <span class="text-[10px] font-mono text-zinc-400 uppercase w-24" x-text="cat"></span>
                                <div class="h-10 w-[1px] bg-zinc-200 hidden md:block"></div>
                                <select class="bg-transparent text-xs font-mono uppercase outline-none text-zinc-900 min-w-[250px]">
                                    <option value="">SELECT_REPA_BY_DROPDOWN</option>
                                    <option value="1">Oatmeal_Power_V3</option>
                                    <option value="2">Salmon_Bowl_V3</option>
                                </select>
                            </div>
                            <div class="mt-4 md:mt-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button class="text-[10px] font-mono text-cyan-600 font-bold uppercase border-b border-cyan-600">Preview_Repas</button>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="mt-12 pt-8 border-t border-zinc-100 flex justify-end">
                    <button class="px-10 py-4 bg-cyan-600 text-white text-[10px] font-mono font-bold uppercase tracking-widest hover:bg-cyan-700 transition-all shadow-lg shadow-cyan-600/10">
                        Finalize_Program_Assembly
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
