<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meals | AntiGravity V3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .rt-btn {
            @apply h-8 w-8 flex items-center justify-center text-zinc-500 hover:text-zinc-900 hover:bg-zinc-100 transition-all;
        }
        [contenteditable]:empty:before {
            content: attr(placeholder);
            color: #a1a1aa;
            font-style: italic;
        }
    </style>
</head>
<body class="bg-zinc-50 antialiased" x-data="{ 
    sidebarOpen: false, 
    p: 30, c: 20, f: 10,
    get kcal() { return (this.p * 4) + (this.c * 4) + (this.f * 9) },
    exec(cmd) { document.execCommand(cmd, false, null) }
}">

    <!-- Sidebar -->
    <aside class="fixed top-0 left-0 h-screen w-64 bg-white ag-border border-l-0 border-t-0 border-b-0 z-50 transition-transform duration-300 lg:translate-x-0" :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
        <div class="p-6">
            <div class="flex items-center space-x-3 mb-12">
                <div class="h-6 w-6 bg-cyan-600"></div>
                <span class="font-mono font-bold text-lg uppercase tracking-tighter">AntiGravity</span>
            </div>
            <nav class="space-y-1">
                <a href="dashboard.html" class="flex items-center px-4 py-3 text-xs font-mono uppercase tracking-widest text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900">Dashboard</a>
                <div class="py-2">
                    <p class="px-4 text-[8px] font-mono text-zinc-400 uppercase tracking-widest mb-2">Nutrition_Engine</p>
                    <a href="categories.html" class="flex items-center px-4 py-2 text-xs font-mono uppercase tracking-widest text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900">Categories</a>
                    <a href="meals.html" class="flex items-center px-4 py-2 text-xs font-mono uppercase tracking-widest bg-cyan-50 text-cyan-700 border-r-2 border-cyan-600">Meals</a>
                    <a href="programs.html" class="flex items-center px-4 py-2 text-xs font-mono uppercase tracking-widest text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900">Programs</a>
                </div>
                <a href="clients.html" class="flex items-center px-4 py-3 text-xs font-mono uppercase tracking-widest text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900">Clients</a>
            </nav>
        </div>
    </aside>

    <main class="lg:ml-64 min-h-screen p-6 lg:p-12 pt-24 lg:pt-12">
        <header class="mb-10">
            <h1 class="text-3xl font-mono font-bold tracking-tighter uppercase text-zinc-900">Meal_Creator</h1>
            <p class="text-[10px] font-mono text-zinc-400 mt-2 uppercase tracking-widest">Step_02: Component Specification</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6">
                <!-- Base Info -->
                <div class="ag-card p-8">
                    <h3 class="text-xs font-mono font-bold uppercase tracking-widest mb-6">Meal_Identity</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[8px] font-mono text-zinc-400 uppercase tracking-widest mb-2">Category</label>
                            <select class="w-full bg-zinc-50 px-4 py-3 text-xs font-mono uppercase ag-border outline-none focus:border-cyan-600">
                                <option>Ftor</option>
                                <option>Gheda</option>
                                <option>Acha</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[8px] font-mono text-zinc-400 uppercase tracking-widest mb-2">Meal_Name</label>
                            <input type="text" placeholder="Salmon_Bowl_V3" class="w-full bg-zinc-50 px-4 py-3 text-xs font-mono uppercase ag-border outline-none focus:border-cyan-600">
                        </div>
                    </div>
                </div>

                <!-- Custom Tailwind RichText -->
                <div class="ag-card bg-white overflow-hidden">
                    <div class="bg-zinc-50 border-b border-zinc-100 p-2 flex items-center space-x-1">
                        <button @click="exec('bold')" class="h-8 w-8 flex items-center justify-center text-zinc-500 hover:text-zinc-900 hover:bg-zinc-100 transition-all font-bold">B</button>
                        <button @click="exec('italic')" class="h-8 w-8 flex items-center justify-center text-zinc-500 hover:text-zinc-900 hover:bg-zinc-100 transition-all italic">I</button>
                        <div class="w-[1px] h-4 bg-zinc-200 mx-2"></div>
                        <button @click="exec('insertUnorderedList')" class="h-8 w-8 flex items-center justify-center text-zinc-500 hover:text-zinc-900 hover:bg-zinc-100 transition-all">•</button>
                        <button @click="exec('insertOrderedList')" class="h-8 w-8 flex items-center justify-center text-zinc-500 hover:text-zinc-900 hover:bg-zinc-100 transition-all">1.</button>
                    </div>
                    <div contenteditable="true" 
                         placeholder="Enter_Repa_Description_Protocol..."
                         class="min-h-[300px] p-6 text-sm text-zinc-900 outline-none focus:ring-0 leading-relaxed font-sans prose prose-sm max-w-none">
                    </div>
                </div>
            </div>

            <!-- Macros Panel -->
            <div class="space-y-6">
                <div class="ag-card p-8 sticky top-24">
                    <h3 class="text-xs font-mono font-bold uppercase tracking-widest mb-8 border-b border-zinc-100 pb-4">Matrix_Analysis</h3>
                    
                    <div class="space-y-8 mb-12">
                        <div class="space-y-3">
                            <div class="flex justify-between text-[10px] font-mono uppercase">
                                <span class="text-zinc-500">Protein (g)</span>
                                <span class="text-cyan-600 font-bold" x-text="p"></span>
                            </div>
                            <input type="number" x-model.number="p" class="w-full bg-zinc-50 px-3 py-2 text-xs font-mono ag-border outline-none">
                        </div>
                        <div class="space-y-3">
                            <div class="flex justify-between text-[10px] font-mono uppercase">
                                <span class="text-zinc-500">Carbs (g)</span>
                                <span class="text-zinc-900 font-bold" x-text="c"></span>
                            </div>
                            <input type="number" x-model.number="c" class="w-full bg-zinc-50 px-3 py-2 text-xs font-mono ag-border outline-none">
                        </div>
                        <div class="space-y-3">
                            <div class="flex justify-between text-[10px] font-mono uppercase">
                                <span class="text-zinc-500">Fats (g)</span>
                                <span class="text-emerald-600 font-bold" x-text="f"></span>
                            </div>
                            <input type="number" x-model.number="f" class="w-full bg-zinc-50 px-3 py-2 text-xs font-mono ag-border outline-none">
                        </div>
                    </div>

                    <div class="text-center p-6 bg-zinc-50 ag-border">
                        <p class="text-[8px] font-mono text-zinc-400 uppercase tracking-widest mb-2">Total_Kcal</p>
                        <div class="text-4xl font-mono font-bold text-zinc-900" x-text="kcal"></div>
                    </div>

                    <button class="w-full py-4 mt-8 bg-zinc-900 text-white text-[10px] font-mono font-bold uppercase tracking-widest hover:bg-black transition-all">
                        Register_Meal
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
