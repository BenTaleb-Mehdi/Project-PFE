<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients | AntiGravity V3.0</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Preline UI -->
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-50 antialiased font-sans" 
      x-data="{ 
        activePage: 'clients',
        isSidebarOpen: false, 
        isLargeScreen: window.innerWidth >= 1024,
        showAssignModal: false,
        selectedClient: null,
        clients: [
            { id: '142', name: 'Mehdi Ben Taleb', goal: 'Shred_X', status: 'Active' },
            { id: '143', name: 'Sarah O.', goal: 'Bulk_Plus', status: 'Pending' }
        ],
        // Modal Dropdown State
        protocolOpen: false,
        selectedProtocol: 'Select_Nutrition_Protocol',
        protocols: ['SHRED_X_V2 (Achraf_Perf)', 'BULK_POWER_HYBRID', 'OATMEAL_SYSTEM_LITE']
      }"
      x-init="window.addEventListener('resize', () => isLargeScreen = window.innerWidth >= 1024)">

    <!-- Header (Mobile) -->
    <!-- Molecule: components/header.html -->
    <header class="lg:hidden sticky top-0 inset-x-0 flex flex-wrap md:justify-start md:flex-nowrap z-[48] w-full bg-white border-b border-zinc-200 text-sm py-2.5 font-mono">
        <nav class="max-w-[85rem] mx-auto w-full px-4 flex justify-between items-center" aria-label="Global">
            <div class="flex items-center space-x-2">
                <div class="h-5 w-5 bg-cyan-600"></div>
                <span class="font-bold text-sm tracking-tighter uppercase text-zinc-950">AntiGravity</span>
            </div>
            
            <button type="button" 
                    @click.stop="isSidebarOpen = true"
                    class="h-11 w-11 inline-flex justify-center items-center gap-x-2 text-start bg-white border border-zinc-200 text-zinc-800 shadow-sm align-middle hover:bg-zinc-50 focus:outline-none focus:bg-zinc-50 transition-all font-mono uppercase">
                <span class="sr-only">Toggle Navigation</span>
                <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
            </button>
        </nav>
    </header>

    <!-- Mobile Backdrop -->
    <div x-show="isSidebarOpen" 
         x-transition.opacity
         @click="isSidebarOpen = false"
         class="fixed inset-0 bg-zinc-950/20 backdrop-blur-sm z-50 lg:hidden"
         style="display: none;"></div>

    <!-- Sidebar -->
    <!-- Molecule: components/sidebar.html -->
    <aside id="application-sidebar" 
           :class="isSidebarOpen || isLargeScreen ? 'translate-x-0' : '-translate-x-full'"
           class="fixed top-0 start-0 bottom-0 z-[60] w-64 bg-white border-e border-zinc-200 transition-all duration-300 transform lg:translate-x-0 font-mono"
           @click.away="isSidebarOpen = false">
        
        <!-- Mobile Close Trigger -->
        <div class="lg:hidden absolute top-4 right-4 z-50">
            <button type="button" 
                    @click.stop="isSidebarOpen = false"
                    class="h-10 w-10 flex items-center justify-center bg-white border border-zinc-200 text-zinc-500 hover:bg-zinc-50 transition-all">
                <span class="sr-only">Close Sidebar</span>
                <svg class="size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>

        <div class="p-6">
            <div class="flex items-center space-x-3 mb-12">
                <div class="h-6 w-6 bg-cyan-600"></div>
                <div class="flex flex-col">
                    <span class="font-bold text-lg tracking-tighter uppercase leading-none text-zinc-950">AntiGravity</span>
                    <span class="text-[8px] text-zinc-400 uppercase tracking-widest mt-1">Light_Engine_V3.0</span>
                </div>
            </div>

            <nav class="hs-accordion-group p-0 w-full flex flex-col flex-wrap" data-hs-accordion-always-open>
                <ul class="space-y-1.5">
                    <li>
                        <a class="flex items-center gap-x-3.5 py-2 px-2.5 text-xs font-bold text-zinc-500 uppercase tracking-widest hover:bg-zinc-50 focus:outline-none" href="dashboard.html">
                            Dashboard
                        </a>
                    </li>

                    <li class="hs-accordion" id="nutrition-accordion">
                        <button type="button" class="hs-accordion-toggle hs-accordion-active:text-cyan-600 w-full text-start flex items-center gap-x-3.5 py-2 px-2.5 text-xs font-bold text-zinc-500 uppercase tracking-widest hover:bg-zinc-50 focus:outline-none" aria-expanded="true">
                            Nutrition_Engine
                            <svg class="hs-accordion-active:block ms-auto hidden size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
                            <svg class="hs-accordion-active:hidden ms-auto block size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                        </button>

                        <div id="nutrition-accordion-content" class="hs-accordion-content w-full overflow-hidden transition-[height] duration-300 hidden" role="region" aria-labelledby="nutrition-accordion">
                            <ul class="pt-2 ps-2">
                                <li>
                                    <a class="flex items-center gap-x-3.5 py-2 px-2.5 text-xs font-bold text-zinc-500 uppercase tracking-widest hover:bg-zinc-50 focus:outline-none" href="categories.html">
                                        Categories
                                    </a>
                                </li>
                                <li>
                                    <a class="flex items-center gap-x-3.5 py-2 px-2.5 text-xs font-bold text-zinc-500 uppercase tracking-widest hover:bg-zinc-50 focus:outline-none" href="nutrition.html">
                                        Nutrition
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </li>

                    <li>
                        <a class="flex items-center gap-x-3.5 py-2 px-2.5 bg-cyan-50 text-xs font-bold text-cyan-700 uppercase tracking-widest border-r-2 border-cyan-600 focus:outline-none" href="clients.html">
                            Clients
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="absolute bottom-0 w-full p-6 bg-zinc-50/50 border-t border-zinc-200">
            <div class="flex items-center space-x-3">
                <div class="h-8 w-8 bg-white border border-zinc-200 flex items-center justify-center text-cyan-600 font-bold text-xs">A</div>
                <div>
                    <p class="text-[10px] font-bold text-zinc-950 uppercase">Achraf_Perf</p>
                    <p class="text-[8px] text-cyan-600 uppercase">Master_Admin</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="lg:ml-64 min-h-screen p-6 lg:p-12 pt-12">
        <header class="mb-10 lg:flex lg:justify-between lg:items-end font-mono">
            <div>
                <h1 class="text-3xl font-bold tracking-tighter uppercase text-zinc-950">Client_Registry</h1>
                <p class="text-[10px] text-zinc-400 mt-2 uppercase tracking-widest">Pupil_Database // Assignment_Protocol</p>
            </div>
            <button class="mt-4 lg:mt-0 px-6 py-3 bg-zinc-950 text-white text-[10px] uppercase font-bold tracking-widest hover:bg-black transition-all shadow-[4px_4px_0px_0px_rgba(0,0,0,0.1)] active:scale-[0.99]">
                Onboard_New_Pupil
            </button>
        </header>

        <!-- Client List -->
        <div class="grid grid-cols-1 gap-4 font-sans">
            <template x-for="client in clients" :key="client.id">
                <div class="ag-card p-6 bg-white flex flex-col md:flex-row md:items-center justify-between group">
                    <div class="flex items-center space-x-6">
                        <div class="h-10 w-10 border border-zinc-200 flex items-center justify-center font-bold text-cyan-600 bg-cyan-50 font-mono" x-text="client.name[0]"></div>
                        <div>
                            <h4 class="text-xs font-bold uppercase text-zinc-900" x-text="client.name"></h4>
                            <p class="text-[10px] text-zinc-400 uppercase mt-1">
                                <span class="font-mono text-cyan-700" x-text="'ID: #' + client.id"></span>
                                <span class="mx-2 opacity-50">//</span>
                                <span x-text="'Goal: ' + client.goal"></span>
                            </p>
                        </div>
                    </div>
                    <div class="mt-4 md:mt-0 flex items-center space-x-6">
                        <span class="px-3 py-1 bg-emerald-50 text-emerald-600 text-[8px] font-bold uppercase tracking-widest border border-emerald-100 font-mono" x-text="client.status"></span>
                        <button @click="selectedClient = client; showAssignModal = true" 
                                class="px-4 py-2 text-[10px] uppercase text-cyan-600 font-bold hover:underline font-mono">
                            Assign_Program
                        </button>
                        <button class="text-zinc-300 hover:text-zinc-950 transition-colors">
                            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                        </button>
                    </div>
                </div>
            </template>
        </div>

        <!-- Assignment Modal -->
        <div x-show="showAssignModal" 
             x-cloak
             class="fixed inset-0 z-[100] flex items-center justify-center p-4 px-6 md:px-0"
             style="display: none;">
            
            <!-- Backdrop -->
            <div x-show="showAssignModal" 
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 @click="showAssignModal = false"
                 class="fixed inset-0 bg-zinc-950/20 backdrop-blur-sm z-[90]"></div>

            <!-- Modal Content -->
            <div x-show="showAssignModal"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95"
                 class="relative bg-white border border-zinc-200 shadow-[4px_4px_0px_0px_rgba(0,0,0,0.05)] w-full max-w-lg z-[100] font-sans">
                
                <div class="flex justify-between items-center py-6 px-8 border-b border-zinc-100">
                    <div>
                        <h3 class="text-xs font-bold uppercase tracking-widest text-zinc-900">Program_Assignment_Wizard</h3>
                        <p class="text-[10px] text-zinc-400 mt-1 uppercase font-mono text-cyan-700" x-text="'Target: ' + (selectedClient ? selectedClient.name : 'PENDING_SELECTION')"></p>
                    </div>
                    <button type="button" 
                            @click="showAssignModal = false"
                            class="inline-flex justify-center items-center size-8 text-sm font-semibold border border-transparent text-zinc-400 hover:text-zinc-900 focus:outline-none">
                        <span class="sr-only">Close</span>
                        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>

                <div class="p-8 space-y-6">
                    <div>
                        <label class="block text-[10px] text-zinc-900 uppercase font-bold tracking-widest mb-2">Select_Nutrition_Protocol</label>
                        <div class="relative">
                            <!-- Advanced Dropdown (The Portal Spec) -->
                            <button @click="protocolOpen = !protocolOpen" 
                                    class="w-full bg-zinc-50 px-4 py-3 text-[10px] items-center justify-between flex border border-zinc-200 outline-none focus:border-cyan-600 transition-colors uppercase font-mono text-cyan-700">
                                <span x-text="selectedProtocol"></span>
                                <svg class="h-4 w-4 text-zinc-400 transition-transform" :class="protocolOpen ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M19 9l-7 7-7-7"/></svg>
                            </button>
                            
                            <div x-show="protocolOpen" 
                                 @click.outside="protocolOpen = false"
                                 x-transition:enter="transition ease-out duration-100"
                                 x-transition:enter-start="opacity-0"
                                 x-transition:enter-end="opacity-100"
                                 class="ag-dropdown-surface absolute left-0 mt-1 w-full bg-white border border-zinc-200 shadow-[4px_4px_0px_0px_rgba(0,0,0,0.05)] z-[110]">
                                <template x-for="p in protocols" :key="p">
                                    <div @click="selectedProtocol = p; protocolOpen = false" 
                                         class="ag-dropdown-item px-4 py-3 text-[10px] uppercase font-bold tracking-widest text-zinc-500 hover:bg-zinc-50 hover:text-cyan-600 cursor-pointer border-l-2 border-transparent hover:border-cyan-600 flex items-center justify-between"
                                         :class="selectedProtocol === p ? 'border-l-cyan-600 bg-zinc-50 text-cyan-600' : ''">
                                        <span x-text="p"></span>
                                        <span x-show="selectedProtocol === p" class="text-cyan-600">
                                            <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>
                                        </span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] text-zinc-900 uppercase font-bold tracking-widest mb-2">Duration_Protocol (Weeks)</label>
                        <input type="number" value="12" class="w-full bg-zinc-50 px-4 py-3 text-[10px] uppercase border border-zinc-200 outline-none focus:border-cyan-600 transition-colors font-mono text-cyan-700">
                    </div>
                    
                    <button type="button" 
                            @click="showAssignModal = false"
                            class="w-full py-4 bg-zinc-950 text-white text-[10px] font-bold uppercase tracking-widest hover:bg-black transition-all shadow-[4px_4px_0px_0px_rgba(0,0,0,0.1)] active:scale-[0.99]">
                        Link_Protocol_to_Client
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
