<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition Engine | AntiGravity V3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        [contenteditable]:empty:before {
            content: attr(placeholder);
            color: #a1a1aa;
            font-style: italic;
        }
    </style>
</head>
<body class="bg-zinc-50 antialiased" x-data="{ 
    sidebarOpen: false, 
    activeTab: 'meals',
    // Meal State
    p: 30, c: 20, f: 10,
    get kcal() { return (this.p * 4) + (this.c * 4) + (this.f * 9) },
    exec(cmd, val = null) { document.execCommand(cmd, false, val) },
    // Program State
    programView: 'list'
}">

    <!-- Sidebar -->
    <aside class="fixed top-0 left-0 h-screen w-64 bg-white ag-border border-l-0 border-t-0 border-b-0 z-50 transition-transform duration-300 lg:translate-x-0" :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
        <div class="p-6">
            <div class="flex items-center space-x-3 mb-12">
                <div class="h-6 w-6 bg-cyan-600"></div>
                <span class="font-mono font-bold text-lg uppercase tracking-tighter">AntiGravity</span>
            </div>
            <nav class="space-y-1">
                <a href="dashboard.html" class="flex items-center px-4 py-3 text-xs font-mono uppercase tracking-widest text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900">Dashboard</a>
                <div class="py-2">
                    <p class="px-4 text-[8px] font-mono text-zinc-400 uppercase tracking-widest mb-2">Nutrition_Engine</p>
                    <a href="categories.html" class="flex items-center px-4 py-2 text-xs font-mono uppercase tracking-widest text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900">Categories</a>
                    <a href="nutrition.html" class="flex items-center px-4 py-2 text-xs font-mono uppercase tracking-widest bg-cyan-50 text-cyan-700 border-r-2 border-cyan-600">Nutrition</a>
                </div>
                <a href="clients.html" class="flex items-center px-4 py-3 text-xs font-mono uppercase tracking-widest text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900">Clients</a>
            </nav>
        </div>
    </aside>

    <main class="lg:ml-64 min-h-screen p-6 lg:p-12 pt-24 lg:pt-12">
        <header class="mb-10 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-mono font-bold tracking-tighter uppercase text-zinc-900">Nutrition_Engine</h1>
                <div class="flex space-x-6 mt-4">
                    <button @click="activeTab = 'meals'" 
                            :class="activeTab === 'meals' ? 'text-cyan-600 border-cyan-600' : 'text-zinc-400 border-transparent'"
                            class="text-[10px] font-mono font-bold uppercase tracking-widest border-b-2 pb-1 transition-all">
                        Meal_Creator
                    </button>
                    <button @click="activeTab = 'programs'" 
                            :class="activeTab === 'programs' ? 'text-cyan-600 border-cyan-600' : 'text-zinc-400 border-transparent'"
                            class="text-[10px] font-mono font-bold uppercase tracking-widest border-b-2 pb-1 transition-all">
                        Program_Manager
                    </button>
                </div>
            </div>
            <div x-show="activeTab === 'programs'">
                <button @click="programView = (programView === 'list' ? 'create' : 'list')" 
                        class="px-6 py-3 bg-zinc-900 text-white text-[10px] font-mono uppercase font-bold tracking-widest hover:bg-black transition-all">
                    <span x-text="programView === 'list' ? 'Create_New_Protocol' : 'Return_to_List'"></span>
                </button>
            </div>
        </header>

        <!-- MEAL CREATOR TAB -->
        <div x-show="activeTab === 'meals'" x-transition class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6">
                <!-- Base Info -->
                <div class="ag-card p-8">
                    <h3 class="text-xs font-mono font-bold uppercase tracking-widest mb-6">Meal_Identity</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div x-data="{ 
                            open: false, 
                            selected: 'Ftor',
                            options: ['Ftor', 'Gheda', 'Acha']
                        }" class="relative">
                            <label class="block text-[8px] font-mono text-zinc-400 uppercase tracking-widest mb-2">Category</label>
                            <button @click="open = !open" 
                                    class="w-full bg-zinc-50 px-4 py-3 text-xs font-mono uppercase ag-border flex items-center justify-between outline-none focus:border-cyan-600">
                                <span x-text="selected"></span>
                                <svg class="h-4 w-4 text-zinc-400 transition-transform" :class="open ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                </svg>
                            </button>
                            <div x-show="open" @click.outside="open = false" x-transition:enter="fade-in-100" class="absolute left-0 mt-1 w-full ag-dropdown-surface z-[9000]">
                                <template x-for="option in options" :key="option">
                                    <div @click="selected = option; open = false" class="ag-dropdown-item" :class="selected === option ? 'border-l-cyan-600 bg-zinc-50 text-cyan-600' : ''">
                                        <div class="flex items-center space-x-3">
                                            <svg x-show="option === 'Ftor'" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.344l-.707.707M12 8a4 4 0 100 8 4 4 0 000-8z" /></svg>
                                            <svg x-show="option === 'Gheda'" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                                            <svg x-show="option === 'Acha'" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                                            <span x-text="option"></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <div>
                            <label class="block text-[8px] font-mono text-zinc-400 uppercase tracking-widest mb-2">Meal_Name</label>
                            <input type="text" placeholder="Salmon_Bowl_V3" class="w-full bg-zinc-50 px-4 py-3 text-xs font-mono uppercase ag-border outline-none focus:border-cyan-600">
                        </div>
                    </div>
                </div>

                <!-- AntiGravity RichText Engine V3.0 -->
                <div class="ag-card bg-white overflow-hidden">
                    <div class="ag-editor-toolbar">
                        <button @click="exec('bold')" class="ag-editor-btn" title="Bold"><strong>B</strong></button>
                        <button @click="exec('italic')" class="ag-editor-btn" title="Italic"><em>I</em></button>
                        <button @click="exec('formatBlock', 'H1')" class="ag-editor-btn">H1</button>
                        <button @click="exec('insertUnorderedList')" class="ag-editor-btn"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h16" /></svg></button>
                        <div class="w-[1px] h-6 bg-zinc-100 mx-1"></div>
                        <button @click="exec('formatBlock', 'PRE')" class="ag-editor-btn"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" /></svg></button>
                    </div>
                    <div contenteditable="true" placeholder="Enter_Repa_Description_Protocol..." class="ag-editor-content prose prose-zinc max-w-none focus:outline-none leading-relaxed font-sans"></div>
                </div>
            </div>

            <!-- Macros Panel -->
            <div class="space-y-6">
                <div class="ag-card p-8 sticky top-24">
                    <h3 class="text-xs font-mono font-bold uppercase tracking-widest mb-8 border-b border-zinc-100 pb-4">Matrix_Analysis</h3>
                    <div class="space-y-8 mb-12">
                        <div class="space-y-3">
                            <div class="flex justify-between text-[10px] font-mono uppercase"><span class="text-zinc-500">Protein (g)</span><span class="text-cyan-600 font-bold" x-text="p"></span></div>
                            <input type="number" x-model.number="p" class="w-full bg-zinc-50 px-3 py-2 text-xs font-mono ag-border outline-none">
                        </div>
                        <div class="space-y-3">
                            <div class="flex justify-between text-[10px] font-mono uppercase"><span class="text-zinc-500">Carbs (g)</span><span class="text-zinc-900 font-bold" x-text="c"></span></div>
                            <input type="number" x-model.number="c" class="w-full bg-zinc-50 px-3 py-2 text-xs font-mono ag-border outline-none">
                        </div>
                        <div class="space-y-3">
                            <div class="flex justify-between text-[10px] font-mono uppercase"><span class="text-zinc-500">Fats (g)</span><span class="text-emerald-600 font-bold" x-text="f"></span></div>
                            <input type="number" x-model.number="f" class="w-full bg-zinc-50 px-3 py-2 text-xs font-mono ag-border outline-none">
                        </div>
                    </div>
                    <div class="text-center p-6 bg-zinc-50 ag-border">
                        <p class="text-[8px] font-mono text-zinc-400 uppercase tracking-widest mb-2">Total_Kcal</p>
                        <div class="text-4xl font-mono font-bold text-zinc-900" x-text="kcal"></div>
                    </div>
                    <button class="w-full py-4 mt-8 bg-zinc-900 text-white text-[10px] font-mono font-bold uppercase tracking-widest hover:bg-black transition-all">Register_Meal</button>
                </div>
            </div>
        </div>

        <!-- PROGRAM MANAGER TAB -->
        <div x-show="activeTab === 'programs'" x-transition class="space-y-6">
            <!-- List View -->
            <div x-show="programView === 'list'" class="ag-card overflow-hidden">
                <table class="w-full text-left font-mono text-[10px]">
                    <thead class="bg-zinc-50 border-b border-zinc-100 text-zinc-400 uppercase">
                        <tr>
                            <th class="px-6 py-4 font-bold tracking-widest">Protocol_Name</th>
                            <th class="px-6 py-4 font-bold tracking-widest">Meals_Count</th>
                            <th class="px-6 py-4 font-bold tracking-widest">Avg_Kcal</th>
                            <th class="px-6 py-4 font-bold tracking-widest text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-zinc-100 uppercase">
                        <tr class="hover:bg-zinc-50 transition-colors">
                            <td class="px-6 py-4 font-bold text-zinc-900">Shred_X_Lite</td>
                            <td class="px-6 py-4 text-zinc-500">4 Slots</td>
                            <td class="px-6 py-4 text-cyan-600 font-bold">1,850 kcal</td>
                            <td class="px-6 py-4 text-right space-x-2">
                                <button class="text-zinc-300 hover:text-cyan-600 uppercase">Edit</button>
                                <button class="text-zinc-300 hover:text-red-500 uppercase">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Create View -->
            <div x-show="programView === 'create'" class="max-w-4xl mx-auto space-y-6">
                <div class="ag-card p-8 bg-white">
                    <h3 class="text-xs font-mono font-bold uppercase tracking-widest mb-10 border-b border-zinc-100 pb-4">Protocol_Timeline_Builder</h3>
                    <div class="space-y-6">
                        <template x-for="cat in ['Ftor', 'Gheda', 'Cas-croûte', 'Acha']" :key="cat">
                            <div class="flex flex-col md:flex-row md:items-center justify-between p-6 bg-zinc-50 ag-border group hover:border-cyan-200 transition-all">
                                <span class="text-[10px] font-mono text-zinc-400 uppercase w-24" x-text="cat"></span>
                                <div x-data="{ open: false, selected: '', options: [{ id: 1, name: 'Oatmeal_Power_V3' }, { id: 2, name: 'Salmon_Bowl_V3' }] }" class="relative min-w-[300px]">
                                    <button @click="open = !open" class="flex items-center justify-between w-full bg-transparent text-xs font-mono uppercase py-2 border-b border-zinc-100 hover:border-cyan-600">
                                        <span x-text="selected ? options.find(o => o.id == selected).name : 'SELECT_MEAL'" :class="!selected ? 'text-zinc-400' : ''"></span>
                                        <svg class="h-3 w-3"><path d="M19 9l-7 7-7-7" /></svg>
                                    </button>
                                    <div x-show="open" @click.outside="open = false" class="absolute left-0 mt-1 w-full ag-dropdown-surface z-[100]">
                                        <template x-for="option in options" :key="option.id">
                                            <div @click="selected = option.id; open = false" class="ag-dropdown-item"><span x-text="option.name"></span></div>
                                        </template>
                                    </div>
                                </div>
                                <button class="text-[10px] font-mono text-cyan-600 font-bold uppercase">Preview</button>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
