<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories | AntiGravity V3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-50 antialiased" x-data="{ 
    sidebarOpen: false, 
    categories: ['Ftor', 'Gheda', 'Cas-croûte', 'Acha'],
    isModalOpen: false,
    editingIndex: null,
    tempName: '',
    
    openModal(index = null) {
        this.editingIndex = index;
        this.tempName = index !== null ? this.categories[index] : '';
        this.isModalOpen = true;
    },
    
    saveCategory() {
        if (this.tempName.trim() === '') return;
        if (this.editingIndex !== null) {
            this.categories[this.editingIndex] = this.tempName;
        } else {
            this.categories.push(this.tempName);
        }
        this.isModalOpen = false;
    }
}">

    <!-- Mobile Header -->
    <header class="lg:hidden fixed top-0 left-0 w-full bg-white ag-border border-l-0 border-r-0 border-t-0 p-4 flex justify-between items-center z-50">
        <div class="flex items-center space-x-3">
            <div class="h-5 w-5 bg-cyan-600"></div>
            <span class="font-mono font-bold text-sm uppercase tracking-tighter">AntiGravity</span>
        </div>
        <button @click="sidebarOpen = !sidebarOpen" class="text-zinc-500">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
    </header>

    <!-- Sidebar -->
    <aside 
        class="fixed top-0 left-0 h-screen w-64 bg-white ag-border border-l-0 border-t-0 border-b-0 z-50 transition-transform duration-300 lg:translate-x-0"
        :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
        <div class="p-6">
            <div class="flex items-center space-x-3 mb-12">
                <div class="h-6 w-6 bg-cyan-600"></div>
                <span class="font-mono font-bold text-lg uppercase tracking-tighter">AntiGravity</span>
            </div>
            <nav class="space-y-1">
                <a href="dashboard.html" class="flex items-center px-4 py-3 text-xs font-mono uppercase tracking-widest text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900">Dashboard</a>
                <div class="py-2">
                    <p class="px-4 text-[8px] font-mono text-zinc-400 uppercase tracking-widest mb-2">Nutrition_Engine</p>
                    <a href="categories.html" class="flex items-center px-4 py-2 text-xs font-mono uppercase tracking-widest bg-cyan-50 text-cyan-700 border-r-2 border-cyan-600">Categories</a>
                    <a href="nutrition.html" class="flex items-center px-4 py-2 text-xs font-mono uppercase tracking-widest text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900">Nutrition</a>
                </div>
                <a href="clients.html" class="flex items-center px-4 py-3 text-xs font-mono uppercase tracking-widest text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900">Clients</a>
            </nav>
        </div>
    </aside>

    <main class="lg:ml-64 min-h-screen p-6 lg:p-12 pt-24 lg:pt-12">
        <header class="mb-10">
            <h1 class="text-3xl font-mono font-bold tracking-tighter uppercase text-zinc-900">Category_Management</h1>
            <p class="text-[10px] font-mono text-zinc-400 mt-2 uppercase tracking-widest">Step_01: Define Meal Sequences</p>
        </header>

        <div class="max-w-4xl space-y-4">
            <template x-for="(cat, index) in categories" :key="index">
                <div class="ag-card p-6 bg-white flex justify-between items-center group">
                    <div class="flex items-center space-x-6">
                        <span class="text-[10px] font-mono text-zinc-300" x-text="'0' + (index + 1)"></span>
                        <h3 class="font-mono font-bold text-sm uppercase tracking-widest text-zinc-900" x-text="cat"></h3>
                    </div>
                    <div class="flex items-center space-x-4 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button @click="openModal(index)" class="text-[8px] font-mono uppercase tracking-widest text-zinc-400 hover:text-cyan-600">Rename</button>
                        <button @click="categories = categories.filter(c => c !== cat)" class="text-[8px] font-mono uppercase tracking-widest text-zinc-400 hover:text-red-500">Delete</button>
                    </div>
                </div>
            </template>

            <button @click="openModal()" 
                    class="w-full py-4 border-2 border-dashed border-zinc-200 text-zinc-400 font-mono text-[10px] uppercase tracking-widest hover:border-cyan-600 hover:text-cyan-600 transition-all">
                + Add_New_Sequence_Slot
            </button>
        </div>
    </main>

    <!-- Edit/Add Modal -->
    <div x-show="isModalOpen" 
         class="fixed inset-0 z-[10000] flex items-center justify-center p-4 bg-zinc-900/10 backdrop-blur-sm"
         x-transition:enter="fade-in-100"
         style="display: none;">
        <div @click.outside="isModalOpen = false" 
             class="bg-white w-full max-w-lg ag-border shadow-[8px_8px_0px_0px_rgba(0,0,0,0.05)] overflow-hidden">
            <div class="px-8 py-6 border-b border-zinc-100 flex justify-between items-center">
                <h3 class="text-xs font-mono font-bold uppercase tracking-widest text-zinc-900" x-text="editingIndex !== null ? 'Rename_Category' : 'New_Sequence_Slot'"></h3>
                <button @click="isModalOpen = false" class="text-zinc-400 hover:text-zinc-900">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div class="p-8">
                <div class="space-y-6">
                    <div>
                        <label class="block text-[8px] font-mono text-zinc-400 uppercase tracking-widest mb-2">Category_Name</label>
                        <input type="text" 
                               x-model="tempName" 
                               @keydown.enter="saveCategory()"
                               placeholder="e.g. BREAKFAST_ENGINE" 
                               class="w-full bg-zinc-50 px-4 py-3 text-xs font-mono uppercase ag-border outline-none focus:border-cyan-600">
                    </div>
                    <div class="flex flex-col space-y-3">
                        <button @click="saveCategory()" 
                                class="w-full py-4 bg-zinc-900 text-white text-[10px] font-mono font-bold uppercase tracking-widest hover:bg-black transition-all">
                            Finalize_Configuration
                        </button>
                        <button @click="isModalOpen = false" 
                                class="w-full py-4 text-[10px] font-mono uppercase text-zinc-400 hover:text-zinc-900 transition-colors">
                            Abandon_Changes
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
