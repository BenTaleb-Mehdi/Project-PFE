<!-- Component: ProtocolTable -->
<!-- Dependencies: ActionButton -->
<div class="ag-card bg-white overflow-hidden shadow-sm">
    <div class="px-6 py-4 border-b border-zinc-100 bg-zinc-50">
        <h3 class="text-[10px] font-bold uppercase tracking-widest text-zinc-500">Active_Protocols</h3>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left text-[10px]">
            <thead class="bg-white border-b border-zinc-100 text-zinc-400 uppercase">
                <tr>
                    <th class="px-6 py-4 font-bold tracking-widest">Protocol_Name</th>
                    <th class="px-6 py-4 font-bold tracking-widest">Meals_Count</th>
                    <th class="px-6 py-4 font-bold tracking-widest">Avg_Kcal</th>
                    <th class="px-6 py-4 font-bold tracking-widest text-right">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-zinc-100 uppercase">
                <tr class="hover:bg-cyan-50/30 transition-colors group">
                    <td class="px-6 py-4 font-bold text-zinc-950 group-hover:text-cyan-700">Protocol_Name</td>
                    <td class="px-6 py-4 text-zinc-500">0 Slots</td>
                    <td class="px-6 py-4 text-cyan-700 font-bold">0,000 kcal</td>
                    <td class="px-6 py-4 text-right">
                        <div class="inline-flex items-center space-x-4">
                            <button class="text-zinc-400 hover:text-cyan-600 transition-colors">Edit</button>
                            <button class="text-zinc-400 hover:text-red-500 transition-colors">Delete</button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
