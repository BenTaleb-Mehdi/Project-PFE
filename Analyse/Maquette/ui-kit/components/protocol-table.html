<!-- Component: ProtocolTable -->
<!-- Dependencies: ActionButton -->
<div class="ag-card bg-white overflow-hidden shadow-sm">
    <div class="px-6 py-4 border-b border-zinc-100 bg-zinc-50">
        <h3 class="text-[10px] font-bold uppercase tracking-widest text-zinc-500">Active_Protocols</h3>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left text-[10px]">
            <thead class="bg-white border-b border-zinc-100 text-zinc-400 uppercase">
                <tr>
                    <th class="px-6 py-4 font-bold tracking-widest">Protocol_Name</th>
                    <th class="px-6 py-4 font-bold tracking-widest">Meals_Count</th>
                    <th class="px-6 py-4 font-bold tracking-widest">Avg_Kcal</th>
                    <th class="px-6 py-4 font-bold tracking-widest text-right">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-zinc-100 uppercase">
                <tr class="hover:bg-cyan-50/30 transition-colors group">
                    <td class="px-6 py-4 font-bold text-zinc-950 group-hover:text-cyan-700">Protocol_Name</td>
                    <td class="px-6 py-4 text-zinc-500">0 Slots</td>
                    <td class="px-6 py-4 text-cyan-700 font-bold">0,000 kcal</td>
                    <td class="px-6 py-4 text-right">
                        <div class="inline-flex items-center space-x-4">
                            <button class="text-zinc-400 hover:text-cyan-600 transition-colors">Edit</button>
                            <button class="text-zinc-400 hover:text-red-500 transition-colors">Delete</button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Table Pagination Atom -->
    <div class="px-6 py-4 border-t border-zinc-100 bg-zinc-50 flex flex-col sm:flex-row items-center justify-between gap-4">
        <span class="text-[10px] text-zinc-500 font-mono uppercase tracking-widest">Showing 1 to 10 of 25</span>
        <div class="flex border border-zinc-200 bg-white shadow-sm">
            <button class="px-3 py-1.5 border-r border-zinc-200 text-[10px] font-mono hover:bg-zinc-50 transition-colors disabled:text-zinc-300" disabled>PREV</button>
            <button class="px-3 py-1.5 border-r border-zinc-200 text-[10px] font-mono bg-zinc-900 text-white font-bold">1</button>
            <button class="px-3 py-1.5 border-r border-zinc-200 text-[10px] font-mono hover:bg-zinc-50 transition-colors text-zinc-600">2</button>
            <button class="px-3 py-1.5 border-r border-zinc-200 text-[10px] font-mono hover:bg-zinc-50 transition-colors text-zinc-600">3</button>
            <span class="px-3 py-1.5 border-r border-zinc-200 text-[10px] font-mono text-zinc-400">...</span>
            <button class="px-3 py-1.5 text-[10px] font-mono hover:bg-zinc-50 transition-colors text-zinc-900">NEXT</button>
        </div>
    </div>
</div>
