<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav Item | AntiGravity Molecule</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'], mono: ['JetBrains Mono','monospace'] } } } }</script>
    <script src="https://cdn.jsdelivr.net/npm/preline@2.0.3/dist/preline.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>* { border-radius: 0 !important; }</style>
</head>
<body class="bg-zinc-50 p-12 font-sans" x-data="{ active: 'dashboard' }">

    <p class="text-[8px] font-mono uppercase text-zinc-300 mb-6">Molecule: NavItem // AG_V3</p>

    <nav class="w-56 bg-white border border-zinc-200 p-3 shadow-[4px_4px_0_0_rgba(0,0,0,0.04)]">
        <p class="text-[8px] text-zinc-400 uppercase tracking-widest mb-3 px-2 font-mono">Navigation</p>

        <!-- Active state -->
        <a href="#" @click.prevent="active = 'dashboard'"
           :class="active === 'dashboard' ? 'border-l-cyan-600 bg-cyan-50 text-cyan-700' : 'border-l-transparent text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900'"
           class="flex items-center gap-3 py-2 px-2.5 text-[10px] font-bold uppercase tracking-widest border-l-2 transition-colors w-full font-sans">
            <svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Dashboard
        </a>

        <a href="#" @click.prevent="active = 'clients'"
           :class="active === 'clients' ? 'border-l-cyan-600 bg-cyan-50 text-cyan-700' : 'border-l-transparent text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900'"
           class="flex items-center gap-3 py-2 px-2.5 text-[10px] font-bold uppercase tracking-widest border-l-2 transition-colors w-full font-sans">
            <svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Clients
        </a>

        <a href="#" @click.prevent="active = 'nutrition'"
           :class="active === 'nutrition' ? 'border-l-cyan-600 bg-cyan-50 text-cyan-700' : 'border-l-transparent text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900'"
           class="flex items-center gap-3 py-2 px-2.5 text-[10px] font-bold uppercase tracking-widest border-l-2 transition-colors w-full font-sans">
            <svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10H12V2Z"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>
            Nutrition
        </a>

        <!-- Disabled state -->
        <a class="flex items-center gap-3 py-2 px-2.5 text-[10px] font-bold uppercase tracking-widest border-l-2 border-l-transparent text-zinc-300 cursor-not-allowed pointer-events-none w-full font-sans">
            <svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
            Reports
        </a>
    </nav>

</body>
</html>
