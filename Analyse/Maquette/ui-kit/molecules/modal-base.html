<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Base | AntiGravity Molecule</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'], mono: ['JetBrains Mono','monospace'] } } } }</script>
    <script src="https://cdn.jsdelivr.net/npm/preline@2.0.3/dist/preline.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>* { border-radius: 0 !important; }</style>
</head>
<body class="bg-zinc-50 p-12 font-sans" x-data="{ open: false }">

    <p class="text-[8px] font-mono uppercase text-zinc-300 mb-6">Molecule: ModalBase // AG_V3</p>

    <!-- Trigger -->
    <button @click="open = true"
            class="px-6 py-3 bg-zinc-950 text-white text-[10px] font-bold uppercase tracking-widest hover:bg-black transition-colors shadow-[4px_4px_0_0_rgba(0,0,0,0.1)] font-sans">
        OPEN_MODAL
    </button>

    <!-- Modal -->
    <div x-show="open"
         x-transition:enter="transition ease-out duration-150"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-100"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-zinc-950/25"
         @click.self="open = false"
         style="display:none;">

        <div x-show="open"
             x-transition:enter="transition ease-out duration-150"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100"
             class="bg-white w-full max-w-lg border border-zinc-200 shadow-[8px_8px_0_0_rgba(0,0,0,0.05)]">

            <!-- Header -->
            <div class="px-8 py-5 border-b border-zinc-100 flex justify-between items-center">
                <div>
                    <h3 class="text-xs font-bold uppercase tracking-widest text-zinc-950 font-sans">Modal_Title</h3>
                    <p class="text-[8px] text-zinc-400 uppercase font-mono mt-1">protocol_id: 00X-ALPH</p>
                </div>
                <button @click="open = false" class="h-8 w-8 flex items-center justify-center border border-zinc-200 text-zinc-400 hover:bg-zinc-50 hover:text-zinc-900 transition-colors">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Content -->
            <div class="p-8">
                <p class="text-sm text-zinc-500 leading-relaxed font-sans mb-6">
                    This is the modal body area. Inject your specific content here — forms, confirmations, data panels, etc.
                </p>
                <div class="bg-zinc-50 border border-zinc-200 p-4 border-l-4 border-l-cyan-600">
                    <p class="text-[9px] text-zinc-500 uppercase font-mono tracking-widest">System_Note // Read_Only</p>
                    <p class="text-xs text-zinc-700 mt-1 font-sans">Action is irreversible. Verify all fields before confirming.</p>
                </div>
            </div>

            <!-- Footer -->
            <div class="px-8 py-5 border-t border-zinc-100 flex justify-end gap-3">
                <button @click="open = false"
                        class="px-5 py-2.5 text-[10px] font-bold uppercase tracking-widest border border-zinc-200 text-zinc-500 hover:bg-zinc-50 transition-colors font-sans">
                    CANCEL
                </button>
                <button class="px-5 py-2.5 text-[10px] font-bold uppercase tracking-widest bg-cyan-600 text-white hover:bg-cyan-700 transition-colors shadow-[4px_4px_0_0_rgba(0,0,0,0.05)] font-sans">
                    CONFIRM_ACTION
                </button>
            </div>
        </div>
    </div>

</body>
</html>
