<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Analyst | Coach Molecule</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'], mono: ['JetBrains Mono','monospace'] } } } }</script>
    <script src="https://cdn.jsdelivr.net/npm/preline@2.0.3/dist/preline.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>* { border-radius: 0 !important; }</style>
</head>
<body class="bg-zinc-50 p-12 font-sans">

    <p class="text-[8px] font-mono uppercase text-zinc-300 mb-6">Molecule: MacroAnalyst // AG_V3</p>

    <div class="max-w-sm bg-white border border-zinc-200 p-8 shadow-[4px_4px_0_0_rgba(0,0,0,0.03)]"
         x-data="{
            protein: 140,
            carbs: 200,
            fat: 60,
            get kcal() { return Math.round(this.protein * 4 + this.carbs * 4 + this.fat * 9); }
         }">

        <h3 class="text-xs font-bold uppercase tracking-widest mb-8 border-b border-zinc-100 pb-4 font-sans text-zinc-900">Matrix_Analysis</h3>

        <div class="space-y-6 mb-10">
            <!-- Protein -->
            <div class="space-y-2">
                <label class="block text-[8px] text-zinc-400 uppercase tracking-widest font-mono">Protein_Entry (g)</label>
                <div class="relative group">
                    <input type="number" min="0" max="999" x-model.number="protein" 
                           class="w-full bg-zinc-50 border border-zinc-200 px-4 py-3 text-xs font-mono font-bold text-cyan-700 outline-none focus:border-cyan-600 focus:bg-white transition-all [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 text-[10px] text-zinc-300 font-mono pointer-events-none group-focus-within:text-cyan-600 transition-colors">PRO</div>
                </div>
            </div>
            <!-- Carbs -->
            <div class="space-y-2">
                <label class="block text-[8px] text-zinc-400 uppercase tracking-widest font-mono">Carbs_Entry (g)</label>
                <div class="relative group">
                    <input type="number" min="0" max="999" x-model.number="carbs" 
                           class="w-full bg-zinc-50 border border-zinc-200 px-4 py-3 text-xs font-mono font-bold text-zinc-900 outline-none focus:border-zinc-900 focus:bg-white transition-all [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 text-[10px] text-zinc-300 font-mono pointer-events-none group-focus-within:text-zinc-900 transition-colors">CAR</div>
                </div>
            </div>
            <!-- Fat -->
            <div class="space-y-2">
                <label class="block text-[8px] text-zinc-400 uppercase tracking-widest font-mono">Fats_Entry (g)</label>
                <div class="relative group">
                    <input type="number" min="0" max="999" x-model.number="fat" 
                           class="w-full bg-zinc-50 border border-zinc-200 px-4 py-3 text-xs font-mono font-bold text-emerald-600 outline-none focus:border-emerald-600 focus:bg-white transition-all [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 text-[10px] text-zinc-300 font-mono pointer-events-none group-focus-within:text-emerald-600 transition-colors">FAT</div>
                </div>
            </div>
        </div>

        <!-- Total -->
        <div class="text-center p-6 bg-zinc-50 border border-zinc-200 border-dashed">
            <p class="text-[8px] text-zinc-400 uppercase tracking-widest mb-2 font-sans">Total_Kcal</p>
            <div class="text-4xl font-bold text-zinc-950 font-mono" x-text="kcal"></div>
            <p class="text-[8px] text-cyan-600 uppercase tracking-widest mt-2 font-sans">Energy_Out</p>
        </div>
    </div>

</body>
</html>
