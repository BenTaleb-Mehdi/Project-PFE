<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons | AntiGravity UI Kit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../admin/style.css">
</head>
<body class="bg-zinc-50 p-12 font-sans">
    <header class="mb-16 border-b-2 border-zinc-900 pb-8">
        <h1 class="text-3xl font-bold tracking-tighter uppercase text-zinc-900">02 // Action_Protocols_Buttons</h1>
        <p class="text-[10px] text-cyan-700 mt-4 font-bold uppercase tracking-widest font-mono">Component_Fragment // Agent_V3.0</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Primary Action -->
        <div class="ag-card p-8 space-y-6">
            <span class="text-[8px] text-zinc-300 font-mono uppercase">Primary_Execute</span>
            <button class="w-full py-4 bg-zinc-950 text-white font-bold text-[10px] uppercase tracking-widest hover:bg-black transition-all shadow-[4px_4px_0px_0px_rgba(0,0,0,0.1)] active:scale-[0.98]">
                FINAL_EXECUTE
            </button>
        </div>

        <!-- Accent Action -->
        <div class="ag-card p-8 space-y-6">
            <span class="text-[8px] text-zinc-300 font-mono uppercase">Accent_Action</span>
            <button class="w-full py-4 bg-cyan-600 text-white font-bold text-[10px] uppercase tracking-widest hover:bg-cyan-700 transition-all shadow-[4px_4px_0px_0px_rgba(0,0,0,0.05)] active:scale-[0.98]">
                SYNC_METRICS
            </button>
        </div>

        <!-- Outline Protocol -->
        <div class="ag-card p-8 space-y-6">
            <span class="text-[8px] text-zinc-300 font-mono uppercase">Outline_State</span>
            <button class="w-full py-4 bg-white border border-zinc-200 text-zinc-500 font-bold text-[10px] uppercase tracking-widest hover:bg-zinc-50 hover:text-zinc-900 transition-all">
                DISCARD_LOG
            </button>
        </div>

        <!-- Ghost / Minimal -->
        <div class="ag-card p-8 space-y-6">
            <span class="text-[8px] text-zinc-300 font-mono uppercase">Ghost_Control</span>
            <button class="w-full py-4 text-zinc-400 font-bold text-[10px] uppercase tracking-widest hover:text-zinc-900 transition-all">
                RETURN_TO_BASE
            </button>
        </div>

        <!-- Icon Action -->
        <div class="ag-card p-8 space-y-6">
            <span class="text-[8px] text-zinc-300 font-mono uppercase">Icon_Trigger</span>
            <div class="flex gap-4">
                <button class="h-12 w-12 flex items-center justify-center border border-zinc-200 hover:bg-zinc-50 transition-all">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 4v16m8-8H4"/></svg>
                </button>
                <button class="h-12 w-12 flex items-center justify-center bg-cyan-600 text-white hover:bg-cyan-700 transition-all shadow-[4px_4px_0px_0px_rgba(0,0,0,0.05)]">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
