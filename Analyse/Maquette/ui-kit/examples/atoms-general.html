<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Atoms | AntiGravity UI Kit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../admin/style.css">
</head>
<body class="bg-zinc-50 p-12 font-sans">
    <header class="mb-16 border-b-2 border-zinc-900 pb-8">
        <h1 class="text-3xl font-bold tracking-tighter uppercase text-zinc-900">01 // Branding_And_Navigation</h1>
        <p class="text-[10px] text-cyan-700 mt-4 font-bold uppercase tracking-widest font-mono">Component_Fragment // Agent_V3.0</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Brand Logo -->
        <div class="ag-card p-8 flex flex-col items-center justify-center space-y-4 transition-all">
            <span class="text-[8px] text-zinc-300 font-mono uppercase">Brand_Identity</span>
            <div class="flex items-center gap-3">
                <div class="h-8 w-8 bg-cyan-600"></div>
                <span class="font-bold text-lg uppercase tracking-tighter text-zinc-900">AntiGravity</span>
            </div>
        </div>

        <!-- Avatar Initials -->
        <div class="ag-card p-8 flex flex-col items-center justify-center space-y-4 font-mono transition-all">
            <span class="text-[8px] text-zinc-300 uppercase">Avatar_Unit</span>
            <div class="h-12 w-12 flex items-center justify-center bg-white border border-zinc-200 text-sm font-bold text-cyan-700">A_P</div>
        </div>

        <!-- Nav Toggle -->
        <div class="ag-card p-8 flex flex-col items-center justify-center space-y-4 transition-all">
            <span class="text-[8px] text-zinc-300 font-mono uppercase">Nav_Toggle</span>
            <button class="h-11 w-11 flex flex-col items-center justify-center gap-1.5 border border-zinc-200 hover:bg-zinc-50 transition-all">
                <div class="h-0.5 w-5 bg-zinc-900"></div>
                <div class="h-0.5 w-5 bg-zinc-900"></div>
            </button>
        </div>

        <!-- Color Swatches -->
        <div class="ag-card p-8 space-y-4 transition-all">
            <span class="text-[8px] text-zinc-300 font-mono uppercase">Base_Swatches</span>
            <div class="flex gap-2">
                <div class="h-10 w-10 bg-cyan-600 border border-zinc-200" title="Cyan-600"></div>
                <div class="h-10 w-10 bg-zinc-900 border border-zinc-200" title="Zinc-900"></div>
                <div class="h-10 w-10 bg-white border border-zinc-200" title="White"></div>
            </div>
        </div>
    </div>
</body>
</html>
