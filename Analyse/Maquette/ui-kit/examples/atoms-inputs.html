<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs | AntiGravity UI Kit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="../../admin/style.css">
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-zinc-50 p-12 font-sans">
    <header class="mb-16 border-b-2 border-zinc-900 pb-8">
        <h1 class="text-3xl font-bold tracking-tighter uppercase text-zinc-900">03 // Input_Channels_Forms</h1>
        <p class="text-[10px] text-cyan-700 mt-4 font-bold uppercase tracking-widest font-mono">Component_Fragment // Agent_V3.0</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Standard Input -->
        <div class="ag-card p-8 space-y-6">
            <span class="text-[8px] text-zinc-300 font-mono uppercase">Standard_Input</span>
            <div class="space-y-2">
                <label class="block text-[8px] text-zinc-400 uppercase tracking-widest">Channel_Label</label>
                <input type="text" placeholder="VALUE_ENTRY..." 
                       class="w-full h-11 bg-zinc-50 border border-zinc-200 px-4 font-mono text-[10px] uppercase focus:outline-none focus:border-cyan-600 transition-all placeholder:opacity-30">
            </div>
        </div>

        <!-- Password Channel -->
        <div class="ag-card p-8 space-y-6">
            <span class="text-[8px] text-zinc-300 font-mono uppercase">Secured_Entry</span>
            <div class="space-y-2">
                <label class="block text-[8px] text-zinc-400 uppercase tracking-widest">Access_Code</label>
                <input type="password" value="********" 
                       class="w-full h-11 bg-zinc-50 border border-zinc-200 px-4 font-mono text-[10px] uppercase focus:outline-none focus:border-cyan-600 transition-all">
            </div>
        </div>

        <!-- Macro Range -->
        <div class="ag-card p-8 space-y-6">
            <span class="text-[8px] text-zinc-300 font-mono uppercase">Macro_Range</span>
            <div class="space-y-4">
                <div class="flex justify-between text-[10px] uppercase font-sans">
                    <span class="text-zinc-500 font-bold">Protein</span>
                    <span class="text-cyan-700 font-bold font-mono">140G</span>
                </div>
                <input type="range" class="w-full h-1.5 bg-zinc-100 appearance-none cursor-pointer accent-cyan-600">
            </div>
        </div>

        <!-- Portal Select -->
        <div class="ag-card p-8 space-y-6" x-data="{ open: false, selected: 'FTOR' }">
            <span class="text-[8px] text-zinc-300 font-mono uppercase">Portal_Select</span>
            <div class="relative">
                <button @click="open = !open" 
                        class="w-full h-11 bg-zinc-50 border border-zinc-200 px-4 text-[10px] font-mono text-cyan-700 flex items-center justify-between uppercase">
                    <span x-text="selected"></span>
                    <svg class="h-4 w-4 transition-transform" :class="open ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M19 9l-7 7-7-7" stroke-width="2"/></svg>
                </button>
                <div x-show="open" @click.outside="open = false" 
                     class="ag-dropdown-surface absolute inset-x-0 mt-1 fade-in-100">
                    <template x-for="opt in ['FTOR', 'GHEDA', 'ACHA']">
                        <div @click="selected = opt; open = false" class="ag-dropdown-item">
                            <span x-text="opt"></span>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Tag System -->
        <div class="ag-card p-8 space-y-6">
            <span class="text-[8px] text-zinc-300 font-mono uppercase">Tag_Output</span>
            <div class="flex flex-wrap gap-2">
                <div class="flex items-center bg-zinc-100 border border-zinc-200 px-2 py-1 gap-2">
                    <span class="text-[8px] font-bold uppercase font-mono">Ketogenic</span>
                    <button class="text-zinc-400 hover:text-red-500">×</button>
                </div>
                <div class="flex items-center bg-cyan-50 border border-cyan-200 px-2 py-1 gap-2">
                    <span class="text-[8px] font-bold uppercase font-mono text-cyan-700">High_Protein</span>
                    <button class="text-cyan-400 hover:text-red-500">×</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
