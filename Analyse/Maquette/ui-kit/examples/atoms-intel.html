<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intel Metrics | AntiGravity UI Kit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../admin/style.css">
</head>
<body class="bg-zinc-50 p-12 font-sans">
    <header class="mb-16 border-b-2 border-zinc-900 pb-8">
        <h1 class="text-3xl font-bold tracking-tighter uppercase text-zinc-900">04 // Intel_Output_Metrics</h1>
        <p class="text-[10px] text-cyan-700 mt-4 font-bold uppercase tracking-widest font-mono">Component_Fragment // Agent_V3.0</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- KPI Metric -->
        <div class="ag-card p-8 group transition-all">
            <span class="text-[8px] text-zinc-300 font-mono uppercase mb-6 block">Kpi_Intel_Unit</span>
            <div class="flex flex-col">
                <span class="text-4xl font-bold tracking-tighter text-zinc-900">1,842<span class="text-cyan-600 text-sm ml-1 font-mono">Kcal</span></span>
                <span class="text-[10px] text-zinc-400 uppercase mt-2 tracking-widest font-sans">Active_Energy_Log</span>
            </div>
        </div>

        <!-- Status Markers -->
        <div class="ag-card p-8 flex flex-col justify-between transition-all">
            <span class="text-[8px] text-zinc-300 font-mono uppercase mb-4">Pulse_Markers</span>
            <div class="flex flex-wrap gap-2">
                <span class="inline-flex py-1 px-3 border border-emerald-200 bg-emerald-50 text-[8px] font-bold text-emerald-700 uppercase font-mono tracking-tighter">Sync_Done</span>
                <span class="inline-flex py-1 px-3 border border-cyan-200 bg-cyan-50 text-[8px] font-bold text-cyan-700 uppercase font-mono tracking-tighter">Live_Sync</span>
                <span class="inline-flex py-1 px-3 border border-zinc-200 bg-white text-[8px] font-bold text-zinc-400 uppercase font-mono tracking-widest">Draft_V3</span>
            </div>
        </div>

        <!-- System Alert -->
        <div class="ag-card p-8 border-cyan-100 bg-cyan-50/20 transition-all">
            <span class="text-[8px] text-cyan-700 font-mono uppercase mb-6 block">System_Focus_Alert</span>
            <p class="text-xs text-zinc-900 leading-relaxed font-sans">
                Analytical engine detected potential <span class="font-bold underline decoration-cyan-400">Protein deficiency</span> in current protocol.
            </p>
        </div>

        <!-- Metric Growth -->
        <div class="ag-card p-8 space-y-4 transition-all">
            <span class="text-[8px] text-zinc-300 font-mono uppercase">Growth_Indicator</span>
            <div class="flex items-baseline space-x-2">
                <span class="text-2xl font-bold font-mono text-emerald-600">+12%</span>
                <span class="text-[10px] text-zinc-400 uppercase">vs_last_sync</span>
            </div>
        </div>
    </div>
</body>
</html>
